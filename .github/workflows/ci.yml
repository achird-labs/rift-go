name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # The engine release whose cdylib, binary and conformance corpus this SDK is tested against.
  # Corpus version == engine release version; they move together.
  RIFT_VERSION: "v0.17.0"

jobs:
  # Unit tests and the DSL-expressibility gate need no engine, so they run everywhere and stay
  # fast. That gate is what catches DSL drift, and it is pure model logic.
  check:
    name: lint + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # go-version-file, not a pinned version: gofmt ships with the toolchain and its behaviour
      # differs between releases (1.26 stopped reordering imports that 1.24 reorders). Pinning CI
      # to a version other than go.mod's floor means the formatter that gates the build is not the
      # formatter the go command uses.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      # v8 installs golangci-lint v2, which is what .golangci.yml is written against. The v6
      # action tops out at v1.x and rejects the v2 schema outright.
      - uses: golangci/golangci-lint-action@v8
        if: runner.os == 'Linux'
        with:
          version: v2.12.2

      # The whole point of the purego binding: a consumer's build is unaffected. Proving it builds
      # without cgo is cheap and it is the claim most worth pinning.
      - name: build with CGO_ENABLED=0
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: unit tests
        run: go test -race -count=1 ./rift/... ./riftembed/... ./rifttest/... ./riftfetch/...

  # The engine-backed lanes: the C-ABI binding, intercept, and the corpus replay on both
  # transports. These need the native library, the engine binary and the corpus.
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: download the engine release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p natives dist

          # Release assets are named by C-style classifier (x86_64/aarch64), which is not Go's
          # spelling — the same bridge riftfetch.Platform makes at runtime.
          case "${{ runner.os }}-${{ runner.arch }}" in
            Linux-X64)   lib=librift_ffi-linux-x86_64.so;      triple=x86_64-unknown-linux-gnu ;;
            Linux-ARM64) lib=librift_ffi-linux-aarch64.so;     triple=aarch64-unknown-linux-gnu ;;
            macOS-ARM64) lib=librift_ffi-darwin-aarch64.dylib; triple=aarch64-apple-darwin ;;
            macOS-X64)   lib=librift_ffi-darwin-x86_64.dylib;  triple=x86_64-apple-darwin ;;
            *) echo "::error::unsupported runner ${{ runner.os }}-${{ runner.arch }}"; exit 1 ;;
          esac

          gh release download "$RIFT_VERSION" --repo achird-labs/rift --dir dist \
            --pattern "$lib" \
            --pattern "rift-$RIFT_VERSION-$triple.tar.gz" \
            --pattern "sdk-conformance-$RIFT_VERSION.tar.gz"

          mv "dist/$lib" natives/
          tar -xzf "dist/rift-$RIFT_VERSION-$triple.tar.gz" -C dist
          tar -xzf "dist/sdk-conformance-$RIFT_VERSION.tar.gz" -C dist

          # Neither archive's internal layout is contractual, so locate rather than assume.
          engine=$(find dist -type f -name rift -perm -u+x | head -1)
          [ -n "$engine" ] || { echo "::error::no rift binary in the release tarball"; exit 1; }
          corpus=$(dirname "$(find dist -type f -name manifest.json | head -1)")
          [ -n "$corpus" ] || { echo "::error::no manifest.json in the corpus tarball"; exit 1; }

          echo "RIFT_FFI_LIB=$PWD/natives/$lib" >> "$GITHUB_ENV"
          echo "RIFT_BINARY=$PWD/$engine" >> "$GITHUB_ENV"
          echo "RIFT_CORPUS_DIR=$PWD/$corpus" >> "$GITHUB_ENV"

      - name: embedded engine + intercept
        run: go test -race -count=1 -v ./riftembed/...

      # Both lanes are required. A fixture may be skipped only when the manifest's `requires`
      # names a capability this lane lacks — never for any other reason — so a run that silently
      # skipped everything would still report green. Assert both lanes actually ran.
      - name: corpus replay, both transports
        run: |
          set -euo pipefail
          go test -count=1 -v ./conformance/... 2>&1 | tee conformance.log
          for lane in embedded remote; do
            grep -q -- "--- PASS: TestServeAndReplay/$lane" conformance.log \
              || { echo "::error::the $lane conformance lane did not run"; exit 1; }
          done
