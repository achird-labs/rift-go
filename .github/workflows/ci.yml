name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # The engine release whose cdylib and conformance corpus this SDK is tested against.
  # Corpus version == engine release version; they move together.
  RIFT_VERSION: "0.1.0"

jobs:
  # Unit tests and the DSL-expressibility gate need no engine, so they run everywhere and stay
  # fast. The gate is the part that catches DSL drift, and it is pure model logic.
  check:
    name: lint + unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: gofmt
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        if: runner.os == 'Linux'
        with:
          version: latest

      # The whole point of the purego binding: a consumer's build is unaffected. Proving it
      # builds without cgo is cheap and it is the claim most worth pinning.
      - name: build with CGO_ENABLED=0
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      - name: unit tests
        run: go test -race -count=1 ./rift/... ./riftembed/... ./rifttest/... ./riftfetch/...

  # The engine-backed lanes: the C-ABI binding, intercept, and the corpus replay on both
  # transports. These need the native library and the corpus, so they are a separate job.
  conformance:
    name: conformance (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          check-latest: true

      - name: download the engine release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p natives corpus-archive

          case "${{ runner.os }}" in
            Linux) lib=librift_ffi.so ;;
            macOS) lib=librift_ffi.dylib ;;
          esac

          gh release download "v${RIFT_VERSION}" \
            --repo achird-labs/rift \
            --pattern "$lib" \
            --pattern "rift" \
            --pattern "sdk-conformance-${RIFT_VERSION}.tar.gz" \
            --dir corpus-archive

          mv "corpus-archive/$lib" natives/
          mv corpus-archive/rift ./rift-engine && chmod +x ./rift-engine
          tar -xzf "corpus-archive/sdk-conformance-${RIFT_VERSION}.tar.gz" -C corpus-archive

          echo "RIFT_FFI_LIB=$PWD/natives/$lib" >> "$GITHUB_ENV"
          echo "RIFT_BINARY=$PWD/rift-engine" >> "$GITHUB_ENV"
          echo "RIFT_CORPUS_DIR=$PWD/corpus-archive/sdk-conformance-${RIFT_VERSION}" >> "$GITHUB_ENV"

      - name: embedded + intercept
        run: go test -race -count=1 -v ./riftembed/...

      # Both lanes are required here. A fixture may be skipped only when the manifest's
      # `requires` names a capability this lane lacks — never for any other reason — so a silent
      # skip of everything would pass. Fail if nothing actually ran.
      - name: corpus replay, both transports
        run: |
          set -euo pipefail
          go test -count=1 -v ./conformance/... 2>&1 | tee conformance.log
          if ! grep -q -- "--- PASS: TestServeAndReplay/embedded" conformance.log; then
            echo "::error::the embedded conformance lane did not run"; exit 1
          fi
          if ! grep -q -- "--- PASS: TestServeAndReplay/remote" conformance.log; then
            echo "::error::the remote conformance lane did not run"; exit 1
          fi
