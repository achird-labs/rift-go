# Reusable dependency-bump scaffold (workflow_call). Shared by every hop of the Rift ecosystem's
# automated dependency loop: it polls an upstream repo's latest release and, when it is newer than the
# version currently pinned, opens a `<branch_prefix><version>` PR that bumps the pin. It is the
# single source of truth for the invariant scaffolding (poll / compare / idempotent branch+PR /
# injection-safe changelog / dry-run); the ONLY per-repo knowledge — which files pin the dependency
# and how to edit them — lives in that repo's `scripts/bump.sh`.
#
# Contract with the calling repo:
#   scripts/bump.sh --current      -> prints the currently pinned version (bare, no leading v)
#   scripts/bump.sh <new-version>  -> rewrites every pin literal and self-verifies (non-zero on failure)
#   secrets: BUMP_TOKEN            -> a PAT the caller must pass; see below for why
#
# WHY THE CALLER MUST PASS A TOKEN: GitHub deliberately does not trigger workflows from events authored
# by GITHUB_TOKEN, so a bump PR opened with the default token reports *zero* checks — CI never runs on
# the very change whose whole purpose is to be CI-verified. In this repo there is a second, harder
# reason: `scripts/bump.sh` rewrites RIFT_VERSION in `.github/workflows/ci.yml`, and GITHUB_TOKEN is
# refused outright when pushing a commit that touches `.github/workflows/`. So BUMP_TOKEN needs the
# `workflows` permission here, not just contents+pull-requests. The secret is declared optional so
# polling and dry runs still work without it, but a real bump fails loudly rather than opening a PR
# that silently never runs.
#
# Callers own the triggers (schedule + workflow_dispatch) and pass inputs; this workflow cannot declare
# its own schedule. The companion auto-release stays per-repo (the publish step genuinely differs per
# stack), so this reusable covers the bump half only.
#
# rift-go has no auto-release: a Go module needs no registry publish, and the first release tag is
# deliberately a human decision. A bump PR here therefore waits for a human even when CI is green.

name: Dependency Bump (reusable)

on:
  workflow_call:
    inputs:
      upstream_repo:
        description: "owner/repo whose latest release drives the bump (e.g. achird-labs/rift)"
        type: string
        required: true
      branch_prefix:
        description: "Branch/PR prefix, e.g. 'chore/engine-' -> chore/engine-0.14.1"
        type: string
        required: true
      dep_name:
        description: "Human name of the dependency for commit/PR messages (e.g. 'rift engine')"
        type: string
        required: true
      dry_run:
        description: "Do everything except push the branch / open the PR"
        type: boolean
        default: false
    secrets:
      BUMP_TOKEN:
        description: >-
          PAT (or fine-grained token) used to push the bump branch and open the PR. Required for a
          real bump; optional so that polling and dry runs still work without it. Needs
          contents:write + pull-requests:write, plus `workflows` — this repo's bump rewrites
          RIFT_VERSION in .github/workflows/ci.yml, which GITHUB_TOKEN may not push.
        required: false

jobs:
  bump:
    name: Check for a newer ${{ inputs.dep_name }} release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      # Falls back to the default token so the read-only poll/compare steps and dry runs keep working
      # in a repo that has not set BUMP_TOKEN; the push/PR path guards on the real secret below.
      GH_TOKEN: ${{ secrets.BUMP_TOKEN || github.token }}
      UPSTREAM_REPO: ${{ inputs.upstream_repo }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Persisted as the credential `git push` uses, so the branch is pushed as the PAT's user
          # rather than as GITHUB_TOKEN — which is also what makes the ci.yml edit pushable.
          token: ${{ secrets.BUMP_TOKEN || github.token }}

      - name: Determine latest upstream release and current pin
        id: versions
        shell: bash
        run: |
          set -euo pipefail

          if ! gh auth status >/dev/null 2>&1; then
            echo "gh is not authenticated (token missing/invalid) — cannot query releases."
            exit 1
          fi

          RELEASE_JSON="$(gh release view --repo "${UPSTREAM_REPO}" --json tagName,body)"
          TAG_NAME="$(echo "${RELEASE_JSON}" | jq -r '.tagName')"
          if [ -z "${TAG_NAME}" ] || [ "${TAG_NAME}" = "null" ]; then
            echo "Could not resolve a latest release tag for ${UPSTREAM_REPO}."
            exit 1
          fi
          LATEST="${TAG_NAME#v}"

          CURRENT="$(bash scripts/bump.sh --current)"
          if [ -z "${CURRENT}" ]; then
            echo "scripts/bump.sh --current returned nothing — cannot read the current pin."
            exit 1
          fi

          echo "Latest upstream release: ${LATEST} (tag ${TAG_NAME})"
          echo "Current pinned version:  ${CURRENT}"
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"

          # Multiline changelog excerpt, truncated so it fits comfortably in a PR body.
          BODY="$(echo "${RELEASE_JSON}" | jq -r '.body // ""' | head -c 4000)"
          # Randomized heredoc delimiter so a release-body line can't spoof the terminator
          # (the documented GitHub Actions multiline-output-injection vector).
          DELIM="DEP_BUMP_BODY_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            echo "${BODY}"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          LATEST="${{ steps.versions.outputs.latest }}"
          CURRENT="${{ steps.versions.outputs.current }}"

          if [ "${LATEST}" = "${CURRENT}" ]; then
            echo "Up to date (current=${CURRENT}, latest=${LATEST}). Nothing to do."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          SMALLEST="$(printf '%s\n%s\n' "${CURRENT}" "${LATEST}" | sort -V | head -n1)"
          if [ "${SMALLEST}" = "${LATEST}" ]; then
            echo "Latest release (${LATEST}) is not newer than current (${CURRENT}). Nothing to do."
            echo "should_bump=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "A newer ${{ inputs.dep_name }} release is available: ${CURRENT} -> ${LATEST}."
          echo "should_bump=true" >> "$GITHUB_OUTPUT"

      - name: Check for an existing branch or PR
        id: existing
        if: steps.compare.outputs.should_bump == 'true'
        shell: bash
        run: |
          set -euo pipefail
          BRANCH="${{ inputs.branch_prefix }}${{ steps.versions.outputs.latest }}"

          EXISTS=false
          if git ls-remote --exit-code --heads origin "${BRANCH}" >/dev/null 2>&1; then
            echo "Branch ${BRANCH} already exists on origin."
            EXISTS=true
          fi

          PR_COUNT="$(gh pr list --repo "${{ github.repository }}" --head "${BRANCH}" --state open --json number --jq 'length')"
          if [ "${PR_COUNT}" -gt 0 ]; then
            echo "An open PR already targets branch ${BRANCH}."
            EXISTS=true
          fi

          if [ "${EXISTS}" = "true" ]; then
            echo "Idempotent no-op: branch/PR for ${BRANCH} already present."
          fi

          echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"
          echo "exists=${EXISTS}" >> "$GITHUB_OUTPUT"

      # Fails before any branch is pushed, rather than opening a PR that can never run CI — or, in this
      # repo, rather than failing mid-push on the .github/workflows/ci.yml edit with a permissions error.
      - name: Require BUMP_TOKEN before pushing
        if: steps.compare.outputs.should_bump == 'true' && steps.existing.outputs.exists == 'false' && inputs.dry_run != true
        shell: bash
        env:
          BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${BUMP_TOKEN}" ]; then
            echo "::error::BUMP_TOKEN secret is not set. A bump PR opened with GITHUB_TOKEN gets zero"
            echo "::error::checks — GitHub does not trigger workflows from GITHUB_TOKEN-authored events."
            echo "::error::In this repo the push would also be refused outright, because scripts/bump.sh"
            echo "::error::rewrites RIFT_VERSION in .github/workflows/ci.yml and GITHUB_TOKEN may not push"
            echo "::error::workflow changes. Add a BUMP_TOKEN secret (contents:write + pull-requests:write"
            echo "::error::+ workflows) and pass it through from the calling workflow."
            echo "::error::No branch was pushed and no PR was opened."
            exit 1
          fi

      - name: Bump the pin and open a PR
        if: steps.compare.outputs.should_bump == 'true' && steps.existing.outputs.exists == 'false'
        shell: bash
        env:
          LATEST: ${{ steps.versions.outputs.latest }}
          CURRENT: ${{ steps.versions.outputs.current }}
          BRANCH: ${{ steps.existing.outputs.branch }}
          DEP_NAME: ${{ inputs.dep_name }}
          DRY_RUN: ${{ inputs.dry_run }}
          CHANGELOG: ${{ steps.versions.outputs.body }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"

          # All repo-specific edits + self-verification live in the repo's bump script.
          bash scripts/bump.sh "${LATEST}"

          git commit -a \
            -m "chore(deps): bump ${DEP_NAME} to ${LATEST}" \
            -m "Bumps the ${DEP_NAME} pin from ${CURRENT} to ${LATEST} via scripts/bump.sh (the single source of truth for this repo's pin literals)."

          PR_TITLE="chore(deps): bump ${DEP_NAME} to ${LATEST}"

          # Build the PR body in a temp file rather than a heredoc: this run step is embedded in an
          # indented YAML block scalar, and a heredoc terminator here would not reliably land at
          # column 0, which breaks heredoc parsing.
          PR_BODY_FILE="$(mktemp)"
          {
            printf 'Bumps the pinned %s version from `%s` to `%s` via `scripts/bump.sh`.\n\n' "${DEP_NAME}" "${CURRENT}" "${LATEST}"
            printf '### Upstream release notes (%s %s)\n\n' "${UPSTREAM_REPO}" "${LATEST}"
            printf '%s\n\n' "${CHANGELOG}"
            printf -- '---\n\n'
            printf 'CI replays the new release'"'"'s conformance corpus against its cdylib and engine binary\n'
            printf 'on both transports, so a green run here means the SDK is compatible with %s — and a\n' "${LATEST}"
            printf 'red one means it is not, which is the whole point of the pin. Merge is left to a human;\n'
            printf 'this repo has no auto-release loop. Opened automatically by the reusable dep-bump workflow.\n'
          } > "${PR_BODY_FILE}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: would push branch '${BRANCH}' and open a PR titled:"
            echo "  ${PR_TITLE}"
            echo "DRY RUN: PR body would be:"
            cat "${PR_BODY_FILE}"
            exit 0
          fi

          git push origin "${BRANCH}"

          gh pr create \
            --repo "${{ github.repository }}" \
            --base "${{ github.event.repository.default_branch || 'master' }}" \
            --head "${BRANCH}" \
            --title "${PR_TITLE}" \
            --body-file "${PR_BODY_FILE}"
